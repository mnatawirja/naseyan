name: naseyan
description: Naseyan staff POS (Android), member app (Android/iOS/web) and back office (web).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

# Versions were pinned from memory without pub.dev access.
# First task in Claude Code: `flutter pub upgrade --major-versions`, then fix any API changes.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  cloud_functions: ^5.5.0
  go_router: ^15.1.2
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
