name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test

  rules:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: rules-tests } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: rules-tests/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test

  flutter:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # Builds installable APKs once the Android project exists (after `flutter create` in app/).
  android:
    needs: flutter
    if: hashFiles('app/android/app/build.gradle', 'app/android/app/build.gradle.kts') != ''
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build apk --release -t lib/main_staff.dart
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/naseyan-staff.apk
      - uses: actions/upload-artifact@v4
        with: { name: naseyan-staff-apk, path: app/build/naseyan-staff.apk }
